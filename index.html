<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolita Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f1ee;
      color: #332925;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-family: cursive;
      margin-top: 30px;
      color: #332925;
    }

    .heart {
      color: #c99c91;
    }

    .subtitle {
      letter-spacing: 6px;
      font-size: 20px;
      margin: 5px 0 15px;
    }

    .intro {
      font-size: 15px;
      line-height: 1.6;
      color: #756761;
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .button {
      display: block;
      padding: 17px;
      border-radius: 18px;
      background: #fffaf8;
      color: #332925;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(80, 50, 40, 0.08);
      border: 1px solid #ead8d2;
    }

    .button:hover {
      background: #f1dfd9;
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #9b847c;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Lolita <span class="heart">♡</span>
    </div>

    <div class="subtitle">
      PORTFOLIO
    </div>

    <p class="intro">
      Telegram bots, graphic design, Figma
      and digital projects.
    </p>

    <div class="menu">

      <a href="#" class="button">
        💼 Portfolio
      </a>

      <a href="#" class="button">
        👩‍💻 About Me
      </a>

      <a href="#" class="button">
        💌 Contact
      </a>

    </div>

    <div class="footer">
      LET'S CREATE TOGETHER
    </div>

  </div>

</body>
</html>
